<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Kemet Social - Egyptian Culture & Tourism Platform" />
  <title>KEMET Social</title>
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="KEMET" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔺</text></svg>" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #C9A84C; }
    #root { min-height: 100vh; }
    .splash { min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px; }
    .splash-icon { font-size:64px; animation:float 2s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    .splash-text { color:#C9A84C; font-size:14px; letter-spacing:1px; font-family:sans-serif; }
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="root">
    <div class="splash">
      <div class="splash-icon">🔺</div>
      <div class="splash-text">KEMET Social ... Loading</div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
